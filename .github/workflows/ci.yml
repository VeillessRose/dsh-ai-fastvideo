name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: JS syntax
        run: |
          node --check index.js
          node --check client.js
          node --check engine/node/render.mjs
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Python syntax
        run: python -m compileall -q engine/python

      - name: Package layout
        run: |
          set -e
          for f in \
            cordis.patch.yml index.js client.js icon.svg \
            locale/zh.json locale/en.json \
            engine/node/render.mjs \
            engine/python/voice_server.py \
            engine/python/videogen/__init__.py \
            engine/python/videogen/paths.py \
            engine/python/videogen/render.py \
            engine/python/videogen/tools/build_job.py \
            engine/python/videogen/tools/dump_catalog.py \
            engine/python/videogen/templates/explain/index.html \
            assets/styles/SOURCES.md \
            LICENSE NOTICE.md README.md
          do
            test -f "$f" || { echo "缺少文件: $f"; exit 1; }
          done
          md=$(find assets/styles -mindepth 2 -name '*.md' | wc -l)
          jpg=$(find assets/styles -mindepth 2 -name '*.jpg' | wc -l)
          echo "styles: ${md} md / ${jpg} jpg"
          test "$md" -ge 300 || { echo "风格库不完整（${md} 条）"; exit 1; }
          echo "layout ok"

      - name: License notices
        run: |
          set -e
          test -f assets/licenses/code-donghua_许可与来源.txt
          test -f assets/licenses/Lemo-Opuscar_LICENSE.txt
          test -f assets/licenses/mg-styles-15_LICENSE.txt
          test -f assets/licenses/code-video_LICENSE.txt
          grep -q "VeillessRose" package.json || { echo "package.json 里没有新仓库地址"; exit 1; }
          echo "licenses ok"
